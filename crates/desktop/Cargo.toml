[package]
name = "linspector"
version = "0.1.0"
edition = "2021"
authors = ["Absolute Markup"]
[dependencies]
cxx = "1"
cxx-qt = "=0.8.1"
cxx-qt-lib = { version = "=0.8.1", features = ["qt_gui", "qt_qml"] }
linspector-inventory = { path = "../inventory" }
serde_json = "1"
[build-dependencies]
cxx-qt-build = { version = "=0.8.1", features = ["link_qt_object_files"] }
